name: Run Job Pipeline

on:
  schedule:
    # Runs daily at 06:00 UTC. Adjust the cron expression if you want a different time.
    - cron: "0 6 * * *"
  workflow_dispatch:
    # Lets you trigger this manually from the GitHub Actions tab, useful for testing
    # without waiting for the schedule.

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/pipeline.py
